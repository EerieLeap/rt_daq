# Kconfig fragment of MCUboot, appended to MCUboot's own configuration by sysbuild (hardware builds,
# see ../sysbuild.cmake and ../sysbuild.conf). It applies to every ESP32 board of rt_daq.
#
# MCUboot is built from the board's devicetree and defconfig, so every driver whose node the board
# enables, and everything the board defconfig turns on for the application, lands in MCUboot too. It
# has to fit 64 KB (boot_partition at 0x0), and it is built without threads, so drivers that need a
# work queue do not link at all. MCUboot loads the application from flash and jumps to it; it needs
# the flash, the log (off) and the crypto, nothing else.
#
# scripts/check_image_sizes.py fails the build when MCUboot outgrows its partition.
#
# Passing -Dmcuboot_EXTRA_CONF_FILE=... replaces this file; list it first to keep these settings.

# The SD card (SPI slot) and the SPI buses of the SD card and of the MCP2518FD CAN FD controller. The SPI
# driver needs threads, which MCUboot is built without: with SPI on, the build fails in spi_context.h.
CONFIG_SDHC=n
CONFIG_DISK_DRIVER_SDMMC=n
CONFIG_DISK_DRIVERS=n
CONFIG_DISK_ACCESS=n
CONFIG_SPI=n

# The status display (SSD1306 over I2C).
CONFIG_DISPLAY=n
CONFIG_SSD1306=n
CONFIG_I2C=n

# The CAN controllers (the SoC's TWAI and the MCP2518FD). CAN itself is off in MCUboot, so these are
# inert; they only stop Kconfig warning that the board defconfig's 'y' has unmet dependencies.
CONFIG_CAN_MCP251XFD=n
CONFIG_CAN_ESP32_TWAI=n

# GPIO: MCUboot drives no pin (no serial recovery, no indication LED). Measured: -7 KB of MCUboot's image.
CONFIG_GPIO=n

# Bench block: MCUboot's log on the console, to watch the swap and the revert of an update (a line per
# step). Uncomment, build, and flash MCUboot once. The log grows MCUboot by about 3 KB (43,536 B in
# all when built; scripts/check_image_sizes.py checks it against the boot partition). The PM board's
# console is its USB-Serial-JTAG port (zephyr,console in the board devicetree, which MCUboot uses as
# well), /dev/ttyACM0. The DevKitC's console is uart0 instead, and its driver selects the GPIO driver:
# there also change CONFIG_GPIO=n above to y (Kconfig refuses to configure it otherwise).
#
# CONFIG_SERIAL=y
# CONFIG_CONSOLE=y
# CONFIG_UART_CONSOLE=y
# CONFIG_MCUBOOT_LOG_LEVEL_INF=y
# CONFIG_MCUBOOT_BOOT_BANNER=y
