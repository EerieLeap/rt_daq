# ==============================
# Debug
# ==============================
CONFIG_DEBUG=y
CONFIG_NO_OPTIMIZATIONS=y
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y

# CONFIG_BOOTLOADER_MCUBOOT=y

# ==============================
# System
# ==============================
CONFIG_XTENSA_INTERRUPT_NONPREEMPTABLE=y


# ==============================
# FAT filesystem
# ==============================
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MKFS=y
CONFIG_FS_FATFS_MOUNT_MKFS=y
# FS Mutex
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y

# ==============================
# SPIRAM
# ==============================
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_SPIRAM_SPEED_80M=y
# 8MB
CONFIG_ESP_SPIRAM_SIZE=8388608
# 2MB
CONFIG_ESP_SPIRAM_HEAP_SIZE=2097152

CONFIG_SPIRAM_RODATA=y
CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y

# Octal flash support; this module has DIO flash.
CONFIG_SPI_FLASH_SUPPORT_MXIC_OPI_CHIP=n

# ==============================
# Logging
# ==============================
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096

# CONFIG_LOG_BACKEND_FS=y
# CONFIG_LOG_BACKEND_FS_OVERWRITE=y
# CONFIG_LOG_BACKEND_FS_APPEND_TO_NEWEST_FILE=y
# CONFIG_LOG_BACKEND_FS_FILE_PREFIX="log"
# CONFIG_LOG_BACKEND_FS_DIR="/SD:/syslog"
# # 10485760 B = 10 MB
# CONFIG_LOG_BACKEND_FS_FILE_SIZE=10485760
# CONFIG_LOG_BACKEND_FS_FILES_LIMIT=10
# CONFIG_LOG_BACKEND_FS_OUTPUT_TEXT=y
# CONFIG_SDMMC_LOG_LEVEL_OFF=y

# ==============================
# CBF subsystem
# ==============================
CONFIG_CHARACTER_FRAMEBUFFER=y

# ==============================
# CANBus
# ==============================
# CONFIG_CAN_MCP251XFD_MAX_FILTERS=8
# CONFIG_CAN_MCP251XFD_MAX_TX_QUEUE=8
# CONFIG_CAN_MCP251XFD_RX_FIFO_ITEMS=8
CONFIG_CAN_MCP251XFD_INT_THREAD_STACK_SIZE=2048
