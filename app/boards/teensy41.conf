# Teensy 4.1 as the bench of the PM HW 1.0 processing module (dev_docs/hw/planning, architecture §7). The pins and the
# devices are in teensy41.overlay and docs/boards.md. Flash with `west flash` (teensy_loader_cli) or the Teensy Loader.
#
# Under Renode (renode/teensy41.resc) build with the renode snippet: west build -b teensy41 -S renode ./app

# ==============================
# Memory
# ==============================
# 512 KB OCRAM2 (overlay). The dynamic work-queue stacks come from the system heap, and the 64 KB of prj.conf ran out
# at the sensor processing service on the first Renode run; what the heap does not take is the libc arena.
CONFIG_HEAP_MEM_POOL_SIZE=131072

# ==============================
# Storage
# ==============================
# The SD card in the Teensy's socket on uSDHC1 stands in for the eMMC: FAT for logs and scripts, as on the PM board.
CONFIG_SDHC=y
CONFIG_SDMMC_STACK=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MKFS=y
CONFIG_FS_FATFS_MOUNT_MKFS=y
CONFIG_FS_FATFS_REENTRANT=y
# Long file names on the heap, as on the PM board: the static-buffer mode is not thread safe and excludes REENTRANT.
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
# littlefs on the W25Q64 boot flash through the FlexSPI NOR driver (from the device tree); the driver runs from ITCM
# while the flash is erased or written, with interrupts off for the duration.

# ==============================
# Buses and devices
# ==============================
# LPSPI4: MCP2518FD (CAN 2); LPSPI3: the ADS7038 from M4 on. The CAN drivers (FlexCAN3 FD and MCP2518FD) follow the
# device tree; CAN_FD_MODE is set in prj.conf. The MCP2518FD interrupt thread stack (2048 as on the PM board) is a
# Teensy default in app/Kconfig, so that the renode snippet, which drops the device, does not trip over it here.
CONFIG_SPI=y
# LPI2C1: SSD1306 display, RV-3028 RTC, PCA9555 expander (drivers from the device tree).
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_RTC=y
# The analog inputs are the internal ADC1 until the ADS7038 driver exists (ADC=y in prj.conf).

# ==============================
# ESP32-C6 co-processor (M6)
# ==============================
# The usdhc2 node is disabled in the overlay until the XIAO ESP32C6 is wired. Enabling it needs the ESP-Hosted-MCU
# driver and the network stack (architecture §6 lists the symbols: WIFI_ESP_HOSTED_MCU, NETWORKING, NET_IPV4,
# NET_DHCPV4, MCUMGR_TRANSPORT_UDP, BT with the hosted HCI).
