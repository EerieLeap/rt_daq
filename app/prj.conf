# Product Info
CONFIG_EERIE_LEAP_PRODUCT_FAMILY_PROCESSING_MODULE=y
# 0xC401
CONFIG_EERIE_LEAP_PRODUCT_ID=50177
CONFIG_EERIE_LEAP_FEATURES_CANBUS=y
CONFIG_EERIE_LEAP_FEATURES_ANALOG_INPUTS=y
CONFIG_EERIE_LEAP_FEATURES_DIGITAL_INPUTS=y
CONFIG_EERIE_LEAP_REVISION=0

# Hardware Version
CONFIG_EERIE_LEAP_HW_VERSION_MAJOR=0
CONFIG_EERIE_LEAP_HW_VERSION_MINOR=0
CONFIG_EERIE_LEAP_HW_VERSION_PATCH=1

# Software Version
CONFIG_EERIE_LEAP_SW_VERSION_MAJOR=0
CONFIG_EERIE_LEAP_SW_VERSION_MINOR=0
CONFIG_EERIE_LEAP_SW_VERSION_PATCH=1

# ==============================
# Language and Compiler
# ==============================
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y
CONFIG_CBPRINTF_FP_SUPPORT=y
# CONFIG_SPEED_OPTIMIZATIONS=y

# ==============================
# Logging And Debugging
# ==============================
CONFIG_LOG=y
CONFIG_LOG_SPEED=y
# Turning on CONFIG_LOG_BLOCK_IN_THREAD will requrie bigger
# CONFIG_LOG_PROCESS_THREAD_STACK_SIZE or will lead to a crash
# CONFIG_LOG_BLOCK_IN_THREAD=y
# CONFIG_LOG_MODE_DEFERRED=y
# NOTE: With CONFIG_LOG_MODE_IMMEDIATE=y, log messages are sent to the console
# immediately, which can cause performance issues.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_EARLY_CONSOLE=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_NAME=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_THREAD_ANALYZER_ISR_STACK_USAGE=n
CONFIG_CRC=y

# ==============================
# System
# ==============================
CONFIG_TIMING_FUNCTIONS=y
CONFIG_NUM_METAIRQ_PRIORITIES=1

# ==============================
# Random Number Generator
# ==============================
CONFIG_ENTROPY_GENERATOR=y
CONFIG_HARDWARE_DEVICE_CS_GENERATOR=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y
# CONFIG_TEST_RANDOM_GENERATOR=y
# CONFIG_TIMER_RANDOM_GENERATOR=y

# ==============================
# Heap Config
# ==============================
CONFIG_SYS_HEAP_ARRAY_SIZE=100
# 64KB
CONFIG_HEAP_MEM_POOL_SIZE=65536
# C++ allocation support
CONFIG_COMMON_LIBC_MALLOC=y
# TODO: STM32H743 seems to consume much more than ESP32S3
# it might need to be investigated, but for now if it's not set
# LIBC malloc will use all available RAM
# 32KB
# CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=32768

# ==============================
# Stack Config
# ==============================
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y

# ==============================
# Hardware
# ==============================
CONFIG_GPIO=y
CONFIG_ADC=y

# ==============================
# FS Config
# ==============================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_DISK_ACCESS=y

CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_BLK_DEV=y
CONFIG_FS_LITTLEFS_CACHE_SIZE=512
# CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=8192

# ==============================
# CBOR
# ==============================
CONFIG_ZCBOR=y

# ==============================
# Application Threads
# ==============================
CONFIG_EERIE_LEAP_FS_SD_THREAD_STACK_SIZE=3072
# A rotation finalizes the old file and writes the next header through FatFs on this thread:
# 3648 bytes measured on the PM board (logging plan, section 6.5); a plain tick uses about 1950,
# and a failed write unwinds an exception here.
CONFIG_EERIE_LEAP_LOG_WRITER_STACK_SIZE=6144
# Sensor processing one level above the display, CAN scheduler and
# calibration threads (6), level with the configuration and CDMP queues (5).
# Measured on the PM board (ADC plan, section 6.7): the 50 ms group's period
# spread fell from 6870-8918 us (19699 us in the boot window) at 6 to
# 24-30 us (102 us) at 5, tick max from 3725 to 1513 us, no new errors.
CONFIG_EERIE_LEAP_DOMAIN_SENSOR_PROCESSING_SERVICE_PRIORITY=5

# ==============================
# CANBus
# ==============================
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y
# CONFIG_CAN_LOG_LEVEL_DBG=y

# ==============================
# Application
# ==============================
CONFIG_EERIE_LEAP_RT_CORE=y
CONFIG_EERIE_LEAP_CONFIGURATION=y
CONFIG_EERIE_LEAP_ADC=y
CONFIG_EERIE_LEAP_CANBUS=y
CONFIG_EERIE_LEAP_CDMP=y
CONFIG_EERIE_LEAP_CFB=y
CONFIG_EERIE_LEAP_DEVICE_TREE=y
CONFIG_EERIE_LEAP_EVENT_BUS=y
CONFIG_EERIE_LEAP_FS=y
CONFIG_EERIE_LEAP_GPIO=y
CONFIG_EERIE_LEAP_LUA_SCRIPT=y
CONFIG_EERIE_LEAP_EXPRESSION_ENGINE=y
CONFIG_EERIE_LEAP_MDF=y
CONFIG_EERIE_LEAP_RANDOM=y
CONFIG_EERIE_LEAP_THREADING=y
CONFIG_EERIE_LEAP_TIME=y

CONFIG_EERIE_LEAP_DOMAIN_ADC=y
CONFIG_EERIE_LEAP_DOMAIN_CANBUS=y
CONFIG_EERIE_LEAP_DOMAIN_CANBUS_COM=y
CONFIG_EERIE_LEAP_DOMAIN_CANBUS_COM_DEVICE_TYPE_LOGGER=y
CONFIG_EERIE_LEAP_DOMAIN_SCRIPT=y
CONFIG_EERIE_LEAP_DOMAIN_SENSOR=y
CONFIG_EERIE_LEAP_DOMAIN_SYSTEM=y
CONFIG_EERIE_LEAP_DOMAIN_LOGGING=y

CONFIG_EERIE_LEAP_CONTROLLER_MANAGEMENT=y
CONFIG_EERIE_LEAP_CONTROLLER_SYSTEM=y
CONFIG_EERIE_LEAP_CONTROLLER_ADC=y
CONFIG_EERIE_LEAP_CONTROLLER_CANBUS=y
CONFIG_EERIE_LEAP_CONTROLLER_SENSORS=y
CONFIG_EERIE_LEAP_CONTROLLER_LOGGING=y

# Lua
CONFIG_EERIE_LEAP_LUA_LOG_LEVEL_DBG=y
