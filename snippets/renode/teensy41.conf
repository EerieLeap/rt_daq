# Teensy 4.1 under Renode: the simulators that replace the devices Renode does not model (teensy41.overlay).
CONFIG_FLASH_SIMULATOR=y
CONFIG_ADC_EMUL=y
CONFIG_CAN_LOOPBACK=y

# No SD host, so no SD disk. FatFS (bench conf) needs a volume to compile: a flash disk named SD on the simulated flash,
# declared but not mounted, as on native_sim.
CONFIG_DISK_DRIVER_SDMMC=n
CONFIG_DISK_DRIVER_FLASH=y

# Thread names and states for the GDB server Renode starts on port 3333.
CONFIG_DEBUG_THREAD_INFO=y
